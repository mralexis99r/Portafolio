<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristian ARS - Home</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }
        .shadow-text {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100" data-title-key="meta.homeTitle">

    <!-- Video Background -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="../assets/background.mp4" type="video/mp4">
        <span data-i18n="video.unsupported">Tu navegador no soporta el video.</span>
    </video>

    <!-- Overlay oscuro -->
    <div class="overlay"></div>

    <!-- Navbar -->
    <nav class="flex justify-between items-center p-5 bg-white bg-opacity-80 shadow dark:bg-gray-800 dark:bg-opacity-80 dark:text-white">
        <div class="text-xl font-bold">Cristian ARS</div>
        <div class="space-x-4">
            <a href="about.html" class="hover:text-blue-500" data-i18n="nav.about">Acerca de</a>
            <a href="projects.html" class="hover:text-blue-500" data-i18n="nav.projects">Mis proyectos</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="flex flex-col justify-center items-center h-[80vh] text-center relative z-10">
        <h1 class="text-4xl font-bold mb-4 text-white shadow-text" data-i18n="home.title">Hola, mi nombre es Cristian Alexis Roman Santiago. Bienvenido a mi sitio web</h1>
        <p class="text-4xl text-white shadow-text" data-i18n="home.subtitle">QA Manual / QA Automation</p>
    </section>

    <!-- Switchers -->
    <div class="fixed bottom-5 right-5 flex space-x-2">
        <div class="flex rounded shadow overflow-hidden" role="group" data-i18n-aria-label="language.selector" aria-label="Seleccionar idioma">
            <button type="button" data-language="es" class="px-3 py-2 font-semibold transition-colors" aria-pressed="true" lang="es">ES</button>
            <button type="button" data-language="en" class="px-3 py-2 font-semibold transition-colors" aria-pressed="false" lang="en">EN</button>
        </div>
        <button type="button" onclick="toggleDarkMode()" class="bg-gray-700 text-white px-4 py-2 rounded shadow" data-i18n-aria-label="theme.toggle" aria-label="Cambiar tema de color">☀️ / 🌙</button>
    </div>

    <script src="../assets/js/i18n.js"></script>
    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>

</body>
</html>
