<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristian ARS - Acerca de</title>
    <script src="https://cdn.tailwindcss.com"></script>

     <script>
    tailwind.config = {
        darkMode: 'class',
    }
</script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100" data-title-key="meta.aboutTitle">

    <!-- Navbar -->
    <nav class="flex justify-between items-center p-5 bg-white shadow dark:bg-gray-800 dark:text-white">
        <div class="text-xl font-bold">Cristian ARS</div>
        <div class="space-x-4">
            <a href="index.html" class="hover:text-blue-500" data-i18n="nav.home">Inicio</a>
            <a href="projects.html" class="hover:text-blue-500" data-i18n="nav.projects">Mis proyectos</a>
        </div>
    </nav>

    <!-- About -->
    <section class="p-10 bg-white shadow-md max-w-3xl mx-auto my-10 rounded text-center dark:bg-gray-800">
        <h2 class="text-3xl font-bold mb-4" data-i18n="about.title">Acerca de mí</h2>
        <p class="mb-4" data-i18n="about.description">Soy un QA Automation Tester con experiencia en automatización de pruebas usando herramientas modernas.</p>
        <a href="../assets/QA_CV_Alexis_Roman.pdf" download class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" data-i18n="about.resume">Descargar CV</a>
    </section>

    <!-- Switchers -->
    <div class="fixed bottom-5 right-5 flex space-x-2">
        <div class="flex rounded shadow overflow-hidden" role="group" data-i18n-aria-label="language.selector" aria-label="Seleccionar idioma">
            <button type="button" data-language="es" class="px-3 py-2 font-semibold transition-colors" aria-pressed="true" lang="es">ES</button>
            <button type="button" data-language="en" class="px-3 py-2 font-semibold transition-colors" aria-pressed="false" lang="en">EN</button>
        </div>
        <button type="button" onclick="toggleDarkMode()" class="bg-gray-700 text-white px-4 py-2 rounded shadow" data-i18n-aria-label="theme.toggle" aria-label="Cambiar tema de color">☀️ / 🌙</button>
    </div>

    <script src="../assets/js/i18n.js"></script>
    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>

</body>
</html>
