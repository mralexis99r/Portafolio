<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristian ARS - Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>

     <script>
    tailwind.config = {
        darkMode: 'class',
    }
</script>


    <style>
        body { font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100">

    <!-- Navbar -->
    <nav class="flex justify-between items-center p-5 bg-white shadow dark:bg-gray-800 dark:text-white">
        <div class="text-xl font-bold">Cristian ARS</div>
        <div class="space-x-4">
            <a href="index.html" class="hover:text-blue-500">Inicio</a>
            <a href="about.html" class="hover:text-blue-500">Acerca de</a>
        </div>
    </nav>

    <!-- Projects -->
    <section class="p-10 bg-white shadow-md max-w-5xl mx-auto my-10 rounded dark:bg-gray-800">
        <h2 class="text-3xl font-bold mb-6" id="projects-title">Mis Proyectos</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-5 bg-gray-200 shadow rounded dark:bg-gray-700">
                <h3 class="text-xl font-semibold">Automatización Facebook</h3>
                <p>Pruebas automatizadas para login, posteo y navegación.</p>
            </div>
            <div class="p-5 bg-gray-200 shadow rounded dark:bg-gray-700">
                <h3 class="text-xl font-semibold">Automatización Amazon</h3>
                <p>Automatización de flujo de compra y validación de carrito.</p>
            </div>
        </div>
    </section>

    <!-- Switchers -->
    <div class="fixed bottom-5 right-5 flex space-x-2">
        <button onclick="switchLanguage()" class="bg-blue-500 text-white px-4 py-2 rounded shadow">Español / English</button>
        <button onclick="toggleDarkMode()" class="bg-gray-700 text-white px-4 py-2 rounded shadow">☀️ / 🌙</button>
    </div>

    <script>
        let lang = 'es';
        const translations = {
            'es': { 'projects-title': 'Mis Proyectos' },
            'en': { 'projects-title': 'My Projects' }
        };

        function switchLanguage() {
            lang = (lang === 'es') ? 'en' : 'es';
            for (const id in translations[lang]) {
                document.getElementById(id).innerText = translations[lang][id];
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>

</body>
</html>
